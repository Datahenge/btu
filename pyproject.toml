[project]
name = "btu"
authors = [
    { name = "Datahenge LLC", email = "brian@datahenge.com"}
]
description = "Background Tasks Unleashed: A task scheduler for Frappe Framework"
dynamic = [ "version" ]
readme = "README.md"
requires-python = ">=3.10,<3.14"

dependencies = [
	"rq~=1.15.1",
	"rq-scheduler~=0.11.0",
	"cron-descriptor",
	"mailchimp_transactional",
	"schema",
	"temporal-lib~=0.1.2"
]

[tool.setuptools]
py-modules = [ "btu" ]

[tool.setuptools.dynamic]
version = {attr = "btu.__version__"}

[project.optional-dependencies]
dev = [
	"ruff>=0.8",
]

# Inherits Frappe's lint/format rules (tabs, line-length 110, etc.).
# Requires this repo to live at <bench>/apps/btu with Frappe at <bench>/apps/frappe.
[tool.ruff]
extend = "../frappe/pyproject.toml"
